<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />


    <meta
      name="viewport"
      content="viewport-fit=cover, width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <meta name="format-detection" content="telephone=no" />
    <meta name="msapplication-tap-highlight" content="no" />
<title>@capgo/capacitor-native-loader</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <main class="container">
      <header>
        <h1>Native Loader</h1>
        <button id="get-version" type="button">Version</button>
      </header>

      <section class="controls" aria-label="Loader controls">
        <label>
          Style
          <select id="loader-style">
            <option value="siri">Siri</option>
            <option value="siri-v2">Siri v2</option>
            <option value="chrome">Chrome top</option>
            <option value="orbit">Orbit</option>
            <option value="ring">Ring</option>
            <option value="pulse">Pulse</option>
            <option value="dots">Dots</option>
            <option value="bars">Bars</option>
            <option value="wave">Wave</option>
            <option value="halo">Halo</option>
            <option value="around">Around</option>
            <option value="lottie">Lottie</option>
            <option value="image">Image</option>
          </select>
        </label>

        <label>
          Placement
          <select id="loader-placement">
            <option value="center">Center</option>
            <option value="top">Top</option>
            <option value="bottom">Bottom</option>
            <option value="fullscreen">Fullscreen</option>
            <option value="around">Around</option>
          </select>
        </label>

        <label>
          Touches
          <select id="interaction-mode">
            <option value="passThrough">Pass through</option>
            <option value="block">Block</option>
            <option value="loaderOnly">Loader only</option>
          </select>
        </label>

        <label>
          Message
          <input id="loader-message" type="text" value="Preparing update" />
        </label>

        <label class="checkbox">
          <input id="resize-webview" type="checkbox" />
          Resize WebView
        </label>

        <label class="checkbox">
          <input id="use-native-view-engine" type="checkbox" data-testid="engine-toggle" />
          Native view engine
        </label>

        <label>
          Progress
          <input id="loader-progress" type="range" min="0" max="100" value="36" />
        </label>
      </section>

      <section class="engine-slot-wrap" aria-label="Engine slot">
        <p class="engine-slot-label">Engine DOM slot</p>
        <div
          id="native-loader-engine-slot"
          class="engine-slot"
          data-testid="engine-slot"
          aria-hidden="true"
        ></div>
      </section>

      <section class="actions" aria-label="Actions">
        <button id="show-loader" type="button" data-testid="show-loader">Show</button>
        <button id="update-loader" type="button">Update</button>
        <button id="set-progress" type="button">Progress</button>
        <button id="hide-loader" type="button" data-testid="hide-loader">Hide</button>
        <button id="web-cover" type="button" data-testid="web-cover">Web cover</button>
        <button id="restore-native" type="button" data-testid="restore-native">Restore native</button>
      </section>

      <div id="web-engine-overlay" class="web-engine-overlay" data-testid="web-engine-overlay" hidden>
        <div class="web-engine-overlay-card">
          <p>Web layer above the native loader</p>
          <button id="dismiss-web-cover" type="button" data-testid="dismiss-web-cover">Dismiss</button>
        </div>
      </div>

      <pre id="plugin-output" data-testid="plugin-output">Idle</pre>
    </main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
