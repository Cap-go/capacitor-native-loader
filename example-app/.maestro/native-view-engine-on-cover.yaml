appId: app.capgo.nativeloader.example
---
- launchApp
- tapOn:
    id: engine-toggle
- tapOn:
    id: show-loader
- assertVisible:
    id: engine-slot
- tapOn:
    id: web-cover
- assertVisible:
    id: web-engine-overlay
- tapOn:
    id: dismiss-web-cover
- assertNotVisible:
    id: web-engine-overlay
- tapOn:
    id: hide-loader