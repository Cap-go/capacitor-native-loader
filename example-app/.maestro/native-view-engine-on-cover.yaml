appId: app.capgo.nativeloader.example
---
- launchApp
- tapOn:
    id: engine-toggle
- tapOn:
    id: show-loader
- assertVisible:
    text: ".*\"id\".*"
- tapOn:
    id: web-cover
- assertVisible:
    text: ".*enginePresentation.*web.*"
- assertVisible:
    id: web-engine-overlay
- tapOn:
    id: dismiss-web-cover
- assertVisible:
    text: ".*enginePresentation.*native.*"
- assertNotVisible:
    id: web-engine-overlay
- tapOn:
    id: hide-loader